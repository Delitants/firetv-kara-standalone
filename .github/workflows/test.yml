name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run integration tests
        run: sh tests/run-tests.sh
      - name: Verify manifests
        run: python3 tests/verify-manifests.py
      - name: Scan excluded content
        run: sh tests/scan-excluded-content.sh
      - name: Run ShellCheck
        run: shellcheck scripts/kara-tool.sh tests/run-tests.sh tests/scan-excluded-content.sh
